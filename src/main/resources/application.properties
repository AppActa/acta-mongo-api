spring.application.name=acta-mongo-api

server.port=${PORT:8081}
spring.jackson.time-zone=America/Sao_Paulo

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/acta_db}
spring.mongodb.representation.uuid=standard
acta.pg-api.base-url=${ACTA_PG_API_BASE_URL:http://localhost:8080/api/v1/}
acta.pg-api.connect-timeout=${ACTA_PG_API_CONNECT_TIMEOUT:3s}
acta.pg-api.read-timeout=${ACTA_PG_API_READ_TIMEOUT:5s}
acta.fcm-api.url=${ACTA_FCM_API_URL:http://localhost:8000}
acta.fcm-api.internal-token=${ACTA_FCM_INTERNAL_TOKEN:}
acta.fcm-api.connect-timeout=${ACTA_FCM_API_CONNECT_TIMEOUT:3s}
acta.fcm-api.read-timeout=${ACTA_FCM_API_READ_TIMEOUT:5s}
acta.viacep.base-url=${ACTA_VIACEP_BASE_URL:https://viacep.com.br/ws/}
acta.viacep.connect-timeout=${ACTA_VIACEP_CONNECT_TIMEOUT:3s}
acta.viacep.read-timeout=${ACTA_VIACEP_READ_TIMEOUT:5s}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
