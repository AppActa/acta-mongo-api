name: validacao

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8.0
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '19'
          cache: maven

      - name: compilar e executar testes
        env:
          MONGODB_URI: mongodb://localhost:27017/acta_test
        run: bash ./mvnw -B clean verify

  seguranca:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: java
          build-mode: manual

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '19'
          cache: maven

      - name: compilar para analise
        run: bash ./mvnw -B clean package -DskipTests

      - uses: github/codeql-action/analyze@v3
